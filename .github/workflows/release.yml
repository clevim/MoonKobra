name: Release

# Publishes a multi-arch image to GHCR and creates the GitHub Release.
# Trigger it by pushing a version tag that matches the VERSION file:
#   1. bump VERSION (e.g. 1.0.1) and add the CHANGELOG section
#   2. git tag v1.0.1 && git push origin v1.0.1
# The in-app update check (/api/update) compares the latest release tag with VERSION.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v1.0.1"
        required: true

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from the tag
        id: ver
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          # strip anything before the first digit (v, v., stray spaces) -> clean X.Y.Z
          VERSION="$(printf '%s' "$RAW" | sed -E 's/^[^0-9]*//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      - name: VERSION file must match the tag
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::VERSION file ($FILE) != tag ${{ steps.ver.outputs.version }}. Bump VERSION before tagging."
            exit 1
          fi

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/moonkobra" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract this version's changelog
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See the commit list below." > RELEASE_NOTES.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MoonKobra ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
